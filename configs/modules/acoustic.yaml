dataset:
  prepost_silence_length: 30
  max_sampling_length: 1024
  f0_process_mode: normal
  phoneme_type: ojt
  time_mask_max_second: 0.0
  time_mask_rate: 0.0
  weighted_speaker_id: null
  speaker_weight: null
  seed: 0
network:
  speaker_embedding_size: 16
  hidden_size: 128
  block_num: 4
  dropout_rate: 0.2
model: {}
train:
  batch_size: 4
  eval_batch_size: 4
  log_epoch: 1
  eval_epoch: 1
  snapshot_epoch: 1
  stop_epoch: 1000
  model_save_num: 2
  optimizer: {name: adam, lr: 0.001}
  scheduler: {name: step, step_size: 100, gamma: 0.9}
  num_processes: 0
  use_gpu: true
  use_amp: true
project:
  name: native-acoustic
